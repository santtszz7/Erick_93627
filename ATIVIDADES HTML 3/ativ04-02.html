<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <title>Loja Alone - Contato</title>
</head>
<body>

    <header>
        <img src="Imagem/whale-9619752_1280.png" alt="Logotipo da Loja" width="10%">
        <h1>Contato - Loja Alone</h1>
        <nav>
            <a href="ativ04.html">Home</a>
        </nav>
        <hr>
    </header>

    <main>
        <h2>Fale Conosco</h2>
        <form action="#" method="post">
      
            <label for="nome">Nome:</label><br>
            <input type="text" id="nome" name="nome" required><br><br>

            <label for="email">E-mail:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="assunto">Assunto:</label><br>
            <select id="assunto" name="assunto">
                <option value="">-- Escolha --</option>
                <option value="duvida">Dúvida</option>
                <option value="reclamacao">Reclamação</option>
                <option value="elogio">Elogio</option>
                <option value="outro">Outro</option>
            </select><br><br>

            <label for="mensagem">Mensagem:</label><br>
            <textarea id="mensagem" name="mensagem" rows="5" cols="40" placeholder="Digite sua mensagem..."></textarea><br><br>

            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </form>

        <br>
        <a href="ativ04.html">⬅ Voltar para a Home</a>
    </main>

    <br>

    <footer>
        <hr>
        <p>© 2025 Loja Alone - Atendimento ao cliente</p>
    </footer>

</body>
</html>
