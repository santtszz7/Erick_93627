<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
</head>
<body>
    <h1>Cadastro de Usuário</h1>
    <form action="/submit" method="post">
    <label for="nome">Nome Completo:</label>
    <input type="text" id="nome" name="nome" required><br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required><br><br>

    <label for="senha">Senha:</label>
    <input type="password" id="senha" name="senha" required><br><br>
    </form>

    <label for="data-nascimento">Data de Nascimento:</label>
    <input type="date" id="data-nascimento" name="data-nascimento" required><br><br>

    <label for="sexo">Sexo:</label>
    <input type="radio" id="masculino" name="sexo" value="masculino">
    <label for="masculino">Masculino</label>
    <input type="radio" id="feminino" name="sexo" value="feminino">
    <label for="feminino">Feminino</label><br><br>

    <label for="interesses">Interesses:</label><br>
    <input type="checkbox" id="tecnologia" name="interesses" value="tecnologia">
    <label for="tecnologia">Tecnologia</label><br>
    
    <input type="checkbox" id="musica" name="interesses" value="musica">
    <label for="musica">Música</label><br>

    <input type="checkbox" id="esportes" name="interesses" value="esportes">
    <label for="esportes">Esportes</label><br>

    <input type="checkbox" id="jornalismo" name="interesses" value="jornalismo">
    <label for="jornalismo">Jornalismo</label><br>

    <input type="checkbox" id="direito" name="interesses" value="direito">
    <label for="direito">Direito</label><br><br>

    <label for="cidade">Cidade:</label><br>
    <select id="cidade" name="cidade">
        <option value="fsa">Feira de Santana</option>
        <option value="sp">São Paulo</option>
        <option value="rj">Rio de Janeiro</option>
        <option value="bh">Belo Horizonte</option>
    </select><br><br>
    
    <input type="submit" value="Cadastrar">
    
</body>
</html>
