<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Pet Shop Alegria Animal</title>
    <!-- Importando o CSS principal -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <nav>
            <div class="logo">
                <img src="img/pet-logo.jpg" alt="Logo Petshop">
            </div>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="#">Serviços</a></li>
                <li><a href="#">Sobre Nós</a></li>
                <li><a href="contato.html" class="active">Contato</a></li>
            </ul>
        </nav>
    </header>

    <!-- FORMULÁRIO DE CONTATO -->
    <section class="contato">
        <h1>Fale Conosco</h1>
        <form action="#" method="post">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

            <label for="mensagem">Mensagem:</label>
            <textarea id="mensagem" name="mensagem" placeholder="Escreva sua mensagem..." required></textarea>

            <button type="submit">Enviar</button>
        </form>

        <!-- WhatsApp -->
        <div class="contato-whatsapp">
            <h2>Ou fale diretamente pelo WhatsApp</h2>
            <a href="https://wa.me/5511999999999" target="_blank" class="btn-whatsapp">
                <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png" alt="WhatsApp">
                Enviar mensagem no WhatsApp
            </a>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <h3>© 2024 Pet Shop Alegria Animal. Todos os direitos reservados.</h3>
    </footer>

</body>
</html>
