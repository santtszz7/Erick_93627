<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalhando com Tabelas</title>
</head>
<body>
    <header>
        <h1>
            <center>Trabalhando com Tabelas</center>
        </h1>
    </header>
    <main>
        <div>
            <h2>
                <center>Tabela de Eletrônicos</center>
            </h2>
            <!-- Tabelas HTML-->
             <table border="1">
                <tr> <!-- Cabeçalho da Tabela-->
                    <th>Produtos</th>
                    <th>Preço</th>
                    <th>Quantidade</th>
                </tr>
                <tr>
                    <th>Notebook Samsung Book 4</th>
                    <th>R$ 4.200,30</th>
                    <th>50</th>
                </tr>
                <tr>
                    <th>Galaxy Watch 8 Classic</th>
                    <th>R$ 8.500,62</th>
                    <th>20</th>
                </tr>
                <tr>
                    <th>TV Samsung Philips 50" tela curva</th>
                    <th>R$ 119.520,20</th>
                    <th>20</th>
                </tr>    
                <tr>
                    <th>Geladeira Sam Sung Consul Brastemp 2</th>
                    <th>R$ 22.100,01</th>
                    <th>14</th>
                 </tr>   
                 <tr>
                    <th>Bicileta Samsung Kaliton Grau</th>
                    <th>R$ 3.50,</th>
                    <th>1</th>
                </tr>        
                </tr>
             </table>
        </div>

    </main>
</body>
</html>
